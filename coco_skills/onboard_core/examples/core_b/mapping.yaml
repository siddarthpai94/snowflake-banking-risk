customer:
  source_file: party.csv.gz
  bronze_table: BRONZE.CORE_B_PARTY
  key: party_uuid
  fields:
    party_kind: DECODE("party_kind", 'ORG', 'ORG', 'PERSON', 'PERSON')
    last_name: IFF(DECODE("party_kind", 'ORG', 'ORG', 'PERSON', 'PERSON') = 'ORG', NULL, UPPER(TRIM(SPLIT_PART("full_name", ',', 1))))
    first_name: IFF(DECODE("party_kind", 'ORG', 'ORG', 'PERSON', 'PERSON') = 'ORG', NULL, UPPER(SPLIT_PART(TRIM(SPLIT_PART("full_name", ',', 2)),
      ' ', 1)))
    birth_date: TRY_TO_DATE("dob", 'MM/DD/YYYY')
    tax_token: NULLIF(LOWER(REGEXP_REPLACE(REGEXP_REPLACE(TRIM("ssn_token"), '^[A-Za-z]+_', ''), '[^0-9A-Fa-f]', '')), '')
    street: UPPER(TRIM("street"))
    city: UPPER(TRIM(SPLIT_PART("city_state_zip", ',', 1)))
    state: UPPER(SPLIT_PART(TRIM(SPLIT_PART("city_state_zip", ',', 2)), ' ', 1))
    zip: SPLIT_PART(TRIM(SPLIT_PART("city_state_zip", ',', 2)), ' ', 2)
    phone: RIGHT(REGEXP_REPLACE("phone_num", '[^0-9]', ''), 10)
    email: LOWER(TRIM("email_addr"))
    customer_since: TRY_TO_DATE("relationship_start", 'YYYY-MM-DD')
account:
  source_file: deposit_account.csv.gz
  bronze_table: BRONZE.CORE_B_DEPOSIT_ACCOUNT
  key: acct_ref
  fields:
    customer_key: '"party_uuid"'
    product_type: DECODE("product_name", 'Business Checking', 'CHECKING', 'Certificate of Deposit', 'CERTIFICATE', 'Everyday Checking', 'CHECKING',
      'Money Market', 'MONEY_MARKET', 'Statement Savings', 'SAVINGS')
    opened_on: TRY_TO_DATE("opened_on", 'YYYY-MM-DD')
    status: DECODE("acct_status", 'CLOSED', 'CLOSED', 'DORMANT', 'DORMANT', 'OPEN', 'OPEN')
    balance_usd: TO_NUMBER("ledger_balance", 38, 2)
transaction:
  source_file: txn.csv.gz
  bronze_table: BRONZE.CORE_B_TXN
  key: txn_uuid
  fields:
    posted_at: TRY_TO_TIMESTAMP_NTZ(LEFT("txn_timestamp", 19))
    txn_type: DECODE("txn_type_desc", 'ACH Credit', 'ACH_CREDIT', 'ACH Debit', 'ACH_DEBIT', 'ATM Withdrawal', 'ATM_WITHDRAWAL', 'Cash Deposit',
      'CASH_DEPOSIT', 'Cash Withdrawal', 'CASH_WITHDRAWAL', 'Check Paid', 'CHECK_PAID', 'Debit Card Purchase', 'CARD_PURCHASE', 'Incoming Wire',
      'WIRE_IN', 'Interest Credit', 'INTEREST', 'Outgoing Wire', 'WIRE_OUT', 'Transfer In', 'TRANSFER_IN', 'Transfer Out', 'TRANSFER_OUT')
    amount_signed_usd: IFF("dr_cr" = 'C', 1, -1) * TO_NUMBER("amount", 38, 2)
    channel: DECODE("channel_desc", 'ATM', 'ATM', 'Mobile App', 'MOBILE', 'Online Banking', 'ONLINE', 'System', 'SYSTEM', 'Teller', 'BRANCH')
    account_key: '"acct_ref"'
