# core_c -> canonical model. GENERATED by onboarding (rules, no AI).
# A person must review the 'review' list and any 'low' confidence field before loading.
source_system: core_c
label: core_c (onboarded by onboarding)
generated_by: onboarding/onboard.py (rules, no AI)
customer:
  source_file: customers.csv.gz
  bronze_table: BRONZE.CORE_C_CUSTOMERS
  key: custId
  fields:
    first_name: UPPER(TRIM("givenName"))
    last_name: UPPER(TRIM("familyName"))
    birth_date: TRY_TO_DATE("birthDate", 'YYYY/MM/DD')
    tax_token: NULLIF(LOWER(REGEXP_REPLACE(REGEXP_REPLACE(TRIM("taxRef"), '^[A-Za-z]+_', ''), '[^0-9A-Fa-f]', '')), '')
    street: UPPER(TRIM("addressLine"))
    city: UPPER(TRIM("cityName"))
    state: UPPER(TRIM("stateCode"))
    zip: '"postalCode"'
    phone: RIGHT(REGEXP_REPLACE("mobile", '[^0-9]', ''), 10)
    customer_since: TO_DATE(TO_TIMESTAMP_NTZ(TRY_TO_NUMBER("createdTs")))
account:
  source_file: accounts.csv.gz
  bronze_table: BRONZE.CORE_C_ACCOUNTS
  key: accountId
  fields:
    product_type: DECODE("accountType", 'CHK', 'CHECKING', 'SVG', 'SAVINGS')
    opened_on: TRY_TO_DATE("openedDate", 'YYYY/MM/DD')
    balance_usd: TO_NUMBER("balanceAmt", 38, 2)
    customer_key: '"custId"'
transaction:
  source_file: postings.csv.gz
  bronze_table: BRONZE.CORE_C_POSTINGS
  key: postingId
  fields:
    account_key: '"accountId"'
    posted_at: TO_TIMESTAMP_NTZ(TRY_TO_NUMBER("postedTs"))
    txn_type: DECODE("typeCode", 'CSHIN', 'CASH_DEPOSIT', 'CSHOUT', 'CASH_WITHDRAWAL', 'EFTIN', 'ACH_CREDIT', 'EFTOUT', 'ACH_DEBIT', 'POS', 'CARD_PURCHASE')
    amount_signed_usd: TO_NUMBER("amt", 38, 2)
    channel: DECODE("channel", 'app', 'MOBILE', 'atm', 'ATM', 'branch', 'BRANCH', 'web', 'ONLINE')
